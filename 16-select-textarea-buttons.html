<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignment 16 | Select and Textarea</title><style>body{font:16px Arial;max-width:600px;margin:2rem auto;padding:0 1rem}label{display:block;margin:.8rem 0 .3rem}</style></head><body>
<h1>Course Feedback</h1><form action="#" method="get"><label for="course">Choose a course</label><select id="course" name="course"><option value="">Select one</option><optgroup label="Web"><option value="html">HTML Basics</option><option value="css">CSS Design</option></optgroup><optgroup label="Other"><option value="accessibility">Accessibility</option></optgroup></select>
<label for="feedback">Your feedback</label><textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="What did you learn?"></textarea>
<p><button type="submit">Submit feedback</button> <button type="reset">Reset</button> <button type="button" onclick="alert('Thanks for reviewing the form!')">Show message</button></p></form></body></html>
