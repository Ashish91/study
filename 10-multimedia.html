<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignment 10 | Multimedia </title>
  </head>
  <body>
    <h1>Multimedia on a Web Page </h1>
    <section>
      <h2>Image </h2>
      <img src="https://placehold.co/640x360/356859/ffffff?text=Nature" alt="Placeholder illustration for a nature image" width="640" height="360" style="max-width:100%;height:auto"></section>
    <section>
      <h2>Video </h2>
      <video controls width="640" preload="metadata"><source src="media/sample-video.mp4" type="video/mp4">Your browser does not support HTML video. Replace media/sample-video.mp4 with your own video file. </video>
    </section>
    <section>
      <h2>Audio </h2>
      <audio controls preload="metadata"><source src="media/sample-audio.mp3" type="audio/mpeg">Your browser does not support HTML audio. Replace media/sample-audio.mp3 with your own audio file. </audio>
    </section>
    <section>
      <h2>YouTube video </h2>
      <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ" title="Sample video on YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="max-width:100%"></iframe>
    </section>
    <p>Place your video and audio files in a sibling <code>media</code> folder or update the source paths. </p>
  </body>
</html>
