<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>my portfolio</h1>
    </header>
    <main>
        <section>education : njms(cbse) | abes(cse)</section>
        <!-- <section tag is used for grouping related content or section of the page   -->
        <article>skills : html, css, js, react, nodejs</article>
        <!-- <article tag is used for independent, self-contained content -->
        <aside>hobbies : reading, coding, gaming</aside>
        <!-- <aside tag is used for content that is tangentially related to the main content or it is used as additional information and add-->
        <a href="https://google.com" target="_main">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
                alt="google logo" width="200" height="100">
        </a>
        <div>
            <p>this is a paragraph</p>
            <p>this is another paragraph</p>
            <p>this is yet another paragraph</p>
        </div>
        <!-- <div tag is used for grouping related content within a section -->
        <!-- block element (takes up the full width of its parent container) -->
        <span>this is a span</span>
        <!-- <span tag is used for grouping inline content within a section -->
        <!-- inline element (does not take up the full width of its parent container) -->
    </main>
    <footer>
        <h5>contact me at hello@example.com</h5>
    </footer>


</body>

</html>
